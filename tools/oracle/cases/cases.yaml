# Nextflow oracle cases (ADR 0011, ADR 0019). Each case is the directory <id>/ next to this file.
# pnpm oracle copies it to .cache/oracle/runs/<id>/ and runs the pinned Nextflow (packages/lang-2610/upstream.json) there:
#   lint: nextflow lint -o json .      run: nextflow run <script> <args> (script main.nf, args [-stub] by default)
# expect: ok = exit status 0 (warnings allowed); error = non-zero exit status.
# errors (lint): each text must appear in one reported error message. output (run): each text must appear in stdout or stderr.
# Expectations must match real Nextflow; a PR that changes one says why.
cases:
  # Spike S1 (F-005): typed and legacy code across files, and in one script.
  - id: s1-typed-calls-legacy
    about: A typed entry workflow calls a legacy process and a legacy workflow included from another file.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nextflow/src/test/groovy/nextflow/script/DataflowTypesTest.groovy#L119-L162
    lint: { expect: ok }
    run: { expect: ok }
  - id: s1-typed-calls-legacy-module
    about: A typed entry workflow calls an nf-core-shaped legacy process from modules/local/ and reads its named outputs.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nextflow/src/test/groovy/nextflow/script/DataflowTypesTest.groovy#L211-L253
      - https://github.com/nf-core/modules/blob/bbd7054a060ab558521f3c6601df5323c96362fd/modules/nf-core/fastqc/main.nf#L5-L17
    lint: { expect: ok }
    run:
      expect: ok
      output: ["txt: ", "s1.count.txt", "versions: "]
  - id: s1-typed-list-literal-tuple
    about: Typed code builds a legacy tuple input with a mixed list literal; lint rejects it and run only warns.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/TypeCheckingVisitor.java#L1403-L1424
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/migrations/26-10.mdx#L22
    lint:
      expect: error
      errors: ["List expression has inconsistent element types"]
    run:
      expect: ok
      output: ["Type checking found 1 error", "txt: "]
  - id: s1-typed-legacy-tuple-arity
    about: Typed code passes a one-component tuple to a two-component legacy tuple input; lint accepts it and run fails.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/TypeCheckingVisitor.java#L990-L994
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/TypeCheckingVisitor.java#L1027-L1033
    lint: { expect: ok }
    run:
      expect: error
      output: ["Input tuple does not match tuple declaration"]
  - id: s1-legacy-calls-typed
    about: A legacy entry workflow calls a typed process and a typed workflow included from another file.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nextflow/src/test/groovy/nextflow/script/DataflowTypesTest.groovy#L74-L117
    lint: { expect: ok }
    run: { expect: ok }
  - id: s1-legacy-calls-typed-module
    about: A legacy entry workflow builds records and calls a typed process with a record input from modules/local/.
    spec: [F-005, LA-14, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx#L145-L165
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/reference/stdlib-namespaces/global.mdx#L184
    lint: { expect: ok }
    run:
      expect: ok
      output: ["count: ", "count.txt"]
  - id: s1-mixed-types-on
    about: One script enables types and defines both a typed and a legacy process.
    spec: [F-005, LA-13, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/static-typing.mdx#L50
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/test/groovy/nextflow/script/parser/ScriptAstBuilderTest.groovy#L544-L585
    lint:
      expect: error
      errors: ["Invalid input declaration in typed process"]
    run:
      expect: error
      output:
        [
          "Script compilation failed",
          "Invalid input declaration in typed process",
        ]
  - id: s1-mixed-types-off
    about: One script without the types flag defines both a legacy and a typed process.
    spec: [F-005, LA-13, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/test/groovy/nextflow/script/parser/ScriptAstBuilderTest.groovy#L498-L542
    lint:
      expect: error
      errors:
        [
          "Typed input declaration is not allowed in legacy process -- set `nextflow.enable.types = true` to use typed processes in this script",
        ]
    run:
      expect: error
      output:
        [
          "Script compilation failed",
          "Typed input declaration is not allowed in legacy process",
        ]
  # Spike S3 (F-007): the known error the language server must report under CheerpJ.
  - id: s3-known-error-500
    about: A 500-line legacy script whose line 487 uses an undefined variable; the language server under CheerpJ must report the same error (spike S3).
    spec: [F-007, ADR-0010]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/ScriptResolveVisitor.java#L326
    lint:
      expect: error
      errors: ["`undefined_channel` is not defined"]
  # F-103: the config AST fixtures. Every file lints clean (warnings allowed); packages/lang-2610/test/config-ast reads them by path.
  - id: config-constructs
    about: Every config construct the config AST models, from the config docs, nf-lang's config tests and the nf-core shapes.
    spec: [F-103, FI-01, FI-05]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/config.mdx#L29-L95
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/config.mdx#L185-L357
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/test/groovy/nextflow/config/formatter/ConfigFormatterTest.groovy#L102-L141
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nextflow/src/test/groovy/nextflow/config/ConfigParserV2Test.groovy#L60-L82
    lint: { expect: ok }
  # F-105: include resolution. Both trees are lint-only; a missing registry module makes lint download or abort, so those are unit-tested.
  - id: f105-includes-resolve
    about: Every include form that resolves (directory, .nf appended, explicit .nf, ../, registry at the root and nested, plugin/, pipeline entries) and nested includeConfig; lint reports no errors.
    spec: [F-105, AR-03, FI-05, IO-32]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/ResolveIncludeVisitor.java#L90-L141
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/ModuleResolver.java#L150-L181
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/module/spi/RemoteModuleResolver.java#L61-L93
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/config/control/ResolveIncludeVisitor.java#L65-L78
    lint: { expect: ok }
  - id: f105-includes-missing
    about: Includes that do not resolve (missing file, directory without main.nf, path outside the project, unknown name, target that does not parse) and missing includeConfig targets, kept out of the root nextflow.config.
    spec: [F-105, AR-03, FI-05]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/ResolveIncludeVisitor.java#L90-L141
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/config/control/ResolveIncludeVisitor.java#L65-L78
    lint:
      expect: error
      errors:
        [
          "missing/c.nf'",
          "Included name 'NOPE' is not defined in module '",
          "modules/b/main.nf'",
          "Module could not be parsed: '",
          "outside/d.nf'",
          "conf/missing.config'",
          "conf/test'",
          "Included name 'LATE_INPUT' is not defined in module '",
          "Unexpected input: ':'",
        ]
  - id: f105-includes-implicit
    about: A statements-only script has an unnamed workflow that is includable as workflow, so including it reports no unknown name (lint reports only the typing rules of pipeline includes and the mixed statements).
    spec: [F-105, AR-03]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/parser/ScriptAstBuilder.java#L276-L283
    lint:
      expect: error
      errors:
        [
          "Statements cannot be mixed with script declarations",
          "Including a pipeline requires `nextflow.enable.types = true` in the including script",
          "An included pipeline must enable static typing",
        ]
  # F-111: edit commands. The mixed script shows lint does not enforce LA-13; the start trees are the property and golden inputs.
  - id: f111-mixed-after-flag
    about: A legacy process, then the types flag, then a typed process in one script; lint and run accept it because the split depends on position, so LA-13 needs the app's own check.
    spec: [F-111, LA-13, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/static-typing.mdx#L50
    lint: { expect: ok }
    run:
      expect: ok
  - id: f111-start-typed
    about: A typed project with three modules (one with a nullable first input and two outputs) and an entry workflow; the start tree of the typed edit sequence.
    spec: [F-111, LA-11, LA-12, AR-22]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-start-legacy
    about: A legacy project with one module and an entry workflow; the start tree of the legacy edit sequence.
    spec: [F-111, LA-14, AR-22]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-edits-typed
    about: The typed start tree after the scripted edit commands (call added, connected, disconnected, reconnected, node deleted, a null placeholder for a missing earlier argument, a multi-output call read by name, process created and renamed); generated by the F-111 golden test.
    spec: [F-111, AR-21, AR-22, LA-12, UX-25]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-edits-legacy
    about: The legacy start tree after the scripted edit commands (an output connected into a chain, a typed process created and called); generated by the F-111 golden test.
    spec: [F-111, AR-21, LA-12, LA-14]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-emit-typed
    about: "A typed workflow whose emits are `x = t` (the form Connect writes for a bare `emit: x`) and `y = x`; checks that the written form lints and runs."
    spec: [F-111, UX-25]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-emit-legacy
    about: The legacy-workflow counterpart of f111-emit-typed.
    spec: [F-111, UX-25]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-addcall-empty-if
    about: The text AddCall writes for a workflow with `if (x) ;`; nf-lang's formatter prints the empty body as a braced block (F-111 structure comparison).
    spec: [F-111, AR-22, LA-45]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/formatter/ScriptFormattingVisitor.java
    lint: { expect: ok }
    run: { expect: ok }
  - id: f111-addcall-twice
    about: A process called twice in one workflow; lint accepts it and the run fails, so AddCall refuses to add the second call. (A workflow called twice runs fine, probed with the same version.)
    spec: [F-111, AR-22]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx
    lint: { expect: ok }
    run:
      expect: error
      output: ["Process 'HELLO' was called twice"]
  - id: f111-connect-legacy
    about: The forms Connect writes between legacy processes (a call assigned to a variable, read by emit name, and by position as G.out[1]).
    spec: [F-111, LA-21, AR-22]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx#L666-L723
    lint: { expect: ok }
    run: { expect: ok }
  # F-107: legacy dataflow. The first is the projection fixture (lint clean, runs with -stub); the second records the
  # runtime class of legacy values, and its probe lines are the output below (recorded from a real run, not written by hand).
  - id: f107-legacy-dataflow
    about: A legacy entry workflow and subworkflow with legacy params, pipes and forks, set and tap, .out by name and index, a process name in a variable, a ternary over .out, legacy-only operators and every legacy process qualifier.
    spec: [F-107, AR-14, LA-21, LA-28]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx#L608-L629
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx#L666-L723
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process.mdx#L1065-L1089
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process.mdx#L1105-L1116
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/reference/operator.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f107-legacy-kinds
    about: The runtime class of legacy values (value, queue or broadcast channel; each makes the result a channel), printed as probe lines.
    spec: [F-107, LA-28, ADR-0005]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/reference/operator.mdx
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process.mdx#L671-L700
    lint: { expect: ok }
    run:
      expect: ok
      output:
        [
          "probe a DataflowBroadcast",
          "probe b DataflowVariable",
          "probe c DataflowVariable",
          "probe ECHO.out.same DataflowBroadcast",
          "probe ONE.out[0] DataflowVariable",
          "probe TWO.out[0] DataflowBroadcast",
          "probe concat DataflowBroadcast",
          "probe last DataflowVariable",
          "probe value.map DataflowVariable",
        ]
  # F-108: code nodes with free-variable ports.
  - id: f108-code-nodes
    about: Arbitrary Groovy statements (declarations, tuple targets, if/else and try/catch assignments, compound assignment, GStrings, logging, list building, closures, a local function call, assert, workflow.onComplete) between dataflow in legacy workflows, plus a typed workflow with the same kinds of statements in its own file.
    spec: [F-108, AR-13, LA-27, LA-10, LA-13, ADR-0004]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/VariableScopeVisitor.java#L603-L713
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow.mdx
    lint: { expect: ok }
    run:
      expect: ok
      args: ["-stub", "--reads", "x", "--threshold", "3"]
      output: ["txt: ", "tagged: R1:", "typed: "]
  # F-205: the canvas fixture, one node of every kind the canvas draws.
  - id: f205-canvas
    about: A typed entry workflow with params, a channel factory, typed and legacy local processes, a registry-shaped legacy module, a typed and a legacy named workflow, a chain, a code statement and an output block; channel, value and plain edges.
    spec: [F-205, UX-21, UX-22, UX-23, UX-24, ADR-0007]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow-typed.mdx
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/modules/nf-lang/src/main/java/nextflow/script/control/ResolveIncludeVisitor.java#L90-L141
    lint: { expect: ok }
    run:
      expect: ok
      args: ["-stub", "--words", "data/words.txt"]
  # F-208: the Code view fixture, before and after its one valid edit.
  - id: f208-code-edit
    about: A typed entry workflow with two processes and one call, the start of the Code view end-to-end edits; the valid edit adds one call (f208-code-edit-after).
    spec: [F-208, UX-27, AR-24, ADR-0039]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow-typed.mdx
    lint: { expect: ok }
    run: { expect: ok }
  - id: f208-code-edit-after
    about: The f208-code-edit tree after the valid edit, which adds the call to the second process.
    spec: [F-208, UX-27, AR-24, ADR-0039]
    sources:
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/process-typed.mdx
      - https://github.com/nextflow-io/nextflow/blob/v26.10.7/docs/workflow-typed.mdx
    lint: { expect: ok }
    run: { expect: ok }
