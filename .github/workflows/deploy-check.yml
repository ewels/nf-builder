# Checks that Netlify deployed this commit with the headers in netlify.toml (F-002, QA-30).
# Netlify builds deploy previews and production itself; this job only observes the result.
name: Deploy check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployed-headers:
    name: Deployed site matches netlify.toml
    # Netlify builds deploy previews only for branches in this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show the commits being checked
        env:
          EVENT: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "event: $EVENT"
          echo "github.sha (merge commit on a PR, pushed commit on main): $MERGE_SHA"
          echo "head sha (what Netlify builds): $HEAD_SHA"
      - name: Check the deploy preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/check-deploy-headers.ts
          --url "https://deploy-preview-${PR_NUMBER}--nf-builder.netlify.app"
          --commit "$HEAD_SHA" --context deploy-preview
      - name: Check production
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-deploy-headers.ts
          --url https://nf-builder.netlify.app
          --commit "$GITHUB_SHA" --context production --allow-newer
