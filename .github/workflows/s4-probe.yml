# Spike S4 (F-008, ADR 0023): cross-origin access from the deployed site, in real browsers.
# Not a merge gate: third-party hosts change, so the probe fails only when the probe itself breaks.
name: S4 probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to probe: the production Pages site"
        required: true
permissions:
  contents: read
concurrency:
  group: s4-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: S4 CORS probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Expressions only in env, never inside run: (no shell injection); probeSite() validates the value.
      S4_PROBE_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Probe (F-008)
        env:
          PW_BROWSERS: chromium,firefox,webkit
        run: pnpm test:e2e -- --config e2e/s4-probe.config.ts
      - name: Upload the probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s4-probe
          path: |
            test-results/s4-probe/
            playwright-report/s4-probe/
          retention-days: 90
          if-no-files-found: error
