# Spike S4 (F-008, ADR 0023): cross-origin access from the deployed site, in real browsers.
# Not a merge gate: third-party hosts change, so the probe fails only when the probe itself breaks.
name: S4 probe
on:
  pull_request:
    paths:
      - "apps/web/public/spike/s4/**"
      - "e2e/s4-probe/**"
      - "e2e/s4-probe*"
      - ".github/workflows/s4-probe.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Site to probe: production or a deploy preview"
        required: true
        default: "https://nf-builder.netlify.app"
permissions:
  contents: read
concurrency:
  group: s4-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: S4 CORS probe
    # Netlify builds deploy previews only for branches in this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Expressions only in env, never inside run: (no shell injection); probeOrigin() validates the value.
      S4_PROBE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--nf-builder.netlify.app', github.event.pull_request.number) || inputs.url }}
      S4_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Wait for the deploy preview of this commit
        if: github.event_name == 'pull_request'
        run: node scripts/check-deploy-headers.ts --url "$S4_PROBE_URL" --commit "$S4_EXPECTED_COMMIT" --context deploy-preview
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Probe (F-008)
        env:
          PW_BROWSERS: chromium,firefox,webkit
        run: pnpm test:e2e -- --config e2e/s4-probe.config.ts
      - name: Upload the probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s4-probe
          path: |
            test-results/s4-probe/
            playwright-report/s4-probe/
          retention-days: 90
          if-no-files-found: error
