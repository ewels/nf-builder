# Netlify build, single-page-app fallback and response headers for https://nf-builder.netlify.app (ADR 0002, QA-30).
# test/netlify-config.test.ts checks this file; `vite preview` and scripts/check-deploy-headers.ts read the headers from it.
# The CSP must stay on one line: a comma or newline would split it into several policies.

[build]
  command = "pnpm --filter @nf-builder/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.23.5"
  PNPM_VERSION = "10.28.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://registry.nextflow.io; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
