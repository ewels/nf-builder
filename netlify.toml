# Netlify build settings, for development builds only (ADR 0040). Production is GitHub Pages.
# Netlify sends no security headers and no single-page-app fallback from this file: the QA-30 policy travels in
# <meta> elements (scripts/security-policy.ts). test/netlify-toml.test.ts keeps the Node and pnpm pins in step
# with package.json and fails if headers or redirects come back.

[build]
  command = "pnpm --filter @nf-builder/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.23.5"
  PNPM_VERSION = "10.28.0"
